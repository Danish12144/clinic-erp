# Disposable Postgres for local dev + the test suite. Not the same
# instance as infrastructure/docker-compose.yml (that one is the old
# scaffold's stack); this is scoped to backend development only.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   alembic upgrade head
#   pytest
services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_erp_backend_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinic_erp
    ports:
      # 5432 is taken by a native Postgres service on this machine; use
      # 5433 on the host side to avoid the conflict.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clinic_erp_backend_test_data:/var/lib/postgresql/data

volumes:
  clinic_erp_backend_test_data:
